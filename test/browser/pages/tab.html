    <title>serial-broker browser test page</title>

  <body>
    <h1>serial-broker browser test page</h1>
    <p>
      Drives the library through <code>window.harness</code>; see test/browser/pages/harness.ts.

    <script type="module">
      import { PROTOCOL_VERSION, SerialBroker } from '/dist/index.js';
      import { installHarness } from '/harness.js';

      installHarness(SerialBroker, PROTOCOL_VERSION, window.webSerialStandIn);
    </script>
  </body>
