<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>serial-broker · debug</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --card: #ffffff;
        --fg: #16181d;
        --muted: #667085;
        --line: #e2e5ea;
        --accent: #1b57c4;
        --accent-soft: #e8effc;
        --ok: #1a7f4b;
        --ok-soft: #e3f4ea;
        --warn: #97600a;
        --warn-soft: #fcf1dd;
        --bad: #b3261e;
        --bad-soft: #fce6e4;
        --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101216;
          --card: #181b21;
          --fg: #e8eaed;
          --muted: #9aa0a9;
          --line: #2c3038;
          --accent: #79a6ff;
          --accent-soft: #1d2a44;
          --ok: #5ac48b;
          --ok-soft: #173427;
          --warn: #e0b050;
          --warn-soft: #3a2e14;
          --bad: #ff8a80;
          --bad-soft: #3d1c1a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.55rem clamp(1rem, 3vw, 2rem);
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .spacer {
        flex: 1;
      }
      .cards {
        display: grid;
        gap: 0.75rem;
      }
      .muted {
        color: var(--muted);
      }
      .page {
        max-width: 62rem;
        margin: 0 auto;
        padding: 1rem clamp(1rem, 3vw, 2rem) 2rem;
        display: grid;
        gap: 0.75rem;
      }
      button,
      .button {
        font: inherit;
        font-weight: 600;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 0.3rem 0.8rem;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        white-space: nowrap;
      }
      button.secondary,
      .menu > summary {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
      }
      button.link {
        background: none;
        border: none;
        padding: 0;
        color: var(--accent);
        font-weight: 500;
      }
      button.danger {
        color: var(--bad);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      select {
        font: inherit;
        padding: 0.3rem 0.45rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: var(--fg);
        min-width: 0;
      }
      .menu {
        position: relative;
      }
      .menu > summary {
        list-style: none;
        cursor: pointer;
        border-radius: 6px;
        padding: 0.3rem 0.6rem;
        font-weight: 600;
      }
      .menu > summary::-webkit-details-marker {
        display: none;
      }
      .popover {
        position: absolute;
        right: 0;
        top: calc(100% + 0.35rem);
        z-index: 10;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 10px 28px rgb(0 0 0 / 0.14);
        padding: 0.75rem;
      }
      .popover.settings {
        width: min(30rem, 92vw);
        display: grid;
        gap: 0.5rem;
      }
      .field label,
      .field-label {
        display: block;
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 0.1rem;
      }
      .field input,
      .field select {
        width: 100%;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: end;
        flex-wrap: wrap;
      }
      .check {
        display: inline-flex;
        gap: 0.35rem;
        align-items: center;
      }
      .facts {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.15rem 0.75rem;
        margin: 0.25rem 0 0;
        padding-top: 0.5rem;
        border-top: 1px solid var(--line);
        font-size: 0.8rem;
      }
      .facts dt {
        color: var(--muted);
      }
      .facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .banner {
        padding: 0.6rem 0.9rem;
        border-radius: 8px;
        background: var(--bad-soft);
        color: var(--bad);
      }
      .empty {
        text-align: center;
        padding: 2.5rem 1rem;
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: 10px;
      }
      .empty p {
        margin: 0 0 0.6rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.7rem 1rem 0.8rem;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .card-head h2 {
        font-size: 1rem;
        margin: 0;
      }
      .badge {
        display: inline-block;
        padding: 0.05rem 0.5rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .badge.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .badge.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .badge.neutral {
        background: var(--bg);
        color: var(--muted);
      }
      .hint {
        margin: 0.3rem 0 0;
        color: var(--muted);
      }
      .hint:empty {
        display: none;
      }
      .message {
        margin: 0.3rem 0 0;
        font-weight: 600;
      }
      .message.error {
        color: var(--bad);
      }
      .message.notice {
        color: var(--muted);
      }
      table.tabs {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.45rem;
        font-size: 0.85rem;
      }
      table.tabs td {
        padding: 0.25rem 0.45rem;
        border-top: 1px solid var(--line);
        vertical-align: middle;
      }
      table.tabs tr.this-tab td {
        background: var(--accent-soft);
      }
      .error-code {
        color: var(--bad);
        font-size: 0.8rem;
      }
      .send {
        display: flex;
        gap: 0.4rem;
        margin-top: 0.55rem;
      }
      .send input {
        flex: 1;
        font-family: var(--mono);
      }
      .sections {
        display: flex;
        gap: 1.25rem;
        flex-wrap: wrap;
        margin-top: 0.45rem;
      }
      .sections > details {
        flex: 1 1 100%;
      }
      details.section > summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 0.85rem;
      }
      dl.settings {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
        gap: 0.1rem 1.25rem;
        margin: 0.35rem 0 0;
        font-size: 0.8rem;
      }
      dl.settings div {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        border-bottom: 1px dotted var(--line);
      }
      dl.settings dt {
        color: var(--muted);
      }
      dl.settings dd {
        margin: 0;
        font-family: var(--mono);
      }
      .log {
        max-height: 11rem;
        overflow-y: auto;
        margin-top: 0.3rem;
        font: 12px/1.45 var(--mono);
      }
      .log.tall {
        max-height: 18rem;
      }
      .entry {
        display: grid;
        grid-template-columns: 6.3rem 3.3rem 1fr;
        gap: 0.4rem;
      }
      .entry .time {
        color: var(--muted);
      }
      .entry .label {
        font-weight: 600;
      }
      .entry .text {
        overflow-wrap: anywhere;
      }
      .entry pre {
        margin: 0.15rem 0 0.35rem;
        white-space: pre-wrap;
      }
      .kind-received .label {
        color: var(--ok);
      }
      .kind-sent .label {
        color: var(--accent);
      }
      .kind-sent-peer .label,
      .kind-ownership .label,
      .kind-log-warn .label {
        color: var(--warn);
      }
      .kind-error .label,
      .kind-log-error .label {
        color: var(--bad);
      }
      .kind-log-debug,
      .kind-log-info {
        color: var(--muted);
      }
      .drawer {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.5rem 1rem;
      }
      .drawer > summary {
        cursor: pointer;
        font-weight: 600;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0;
        width: min(36rem, 94vw);
        background: var(--card);
        color: var(--fg);
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.35);
      }
      dialog form {
        padding: 1rem 1.1rem;
        display: grid;
        gap: 0.7rem;
      }
      dialog h2 {
        margin: 0;
        font-size: 1.05rem;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
        gap: 0.5rem 0.6rem;
      }
      .fields .wide {
        grid-column: span 2;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <strong>serial-broker</strong>
      <span id="busStatus" class="muted"></span>
      <span class="spacer"></span>
      <button id="newButton" type="button">New configuration</button>
      <details id="settingsMenu" class="menu">
        <summary title="Library settings and platform">Settings</summary>
        <div class="popover settings">
          <div class="field">
            <label for="workerUrl">Worker URL — must be the application's</label>
            <input id="workerUrl" spellcheck="false" />
          </div>
          <div class="row">
            <div class="field">
              <label for="transport">Transport</label>
              <select id="transport">
                <option value="auto">auto</option>
                <option value="sharedworker">sharedworker</option>
                <option value="broadcastchannel">broadcastchannel</option>
              </select>
            </div>
            <label class="check"
              ><input id="logPayloads" type="checkbox" /> log payload bytes</label
            >
            <span class="spacer"></span>
            <button id="copyLink" type="button" class="secondary">Copy link</button>
            <button id="applySettings" type="button">Apply</button>
          </div>
          <p id="linkNote" class="hint"></p>
          <dl id="facts" class="facts"></dl>
        </div>
      </details>
    </header>

    <div class="page">
      <div id="banner" class="banner" hidden></div>

      <section id="empty" class="empty" hidden>
        <p><strong>Nothing is running on this origin.</strong></p>
        <p class="muted">
          Set a configuration up here, or check Settings: tabs on another worker URL or transport
          are invisible.
        </p>
        <button id="emptyNewButton" type="button">New configuration</button>
      </section>

      <div id="cards" class="cards"></div>

      <details class="drawer">
        <summary>Library log</summary>
        <div class="row" style="margin-top: 0.4rem">
          <label class="check"
            >level
            <select id="logLevel">
              <option value="debug">debug</option>
              <option value="info" selected>info</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
          </label>
          <button id="clearLog" type="button" class="link">clear</button>
        </div>
        <div id="libraryLog" class="log tall" role="log"></div>
      </details>
    </div>

    <template id="cardTemplate">
      <article class="card">
        <header class="card-head">
          <h2 data-part="name"></h2>
          <span data-part="status" class="badge"></span>
          <span data-part="summary" class="muted"></span>
          <span class="spacer"></span>
          <button data-part="choose" type="button">Choose device…</button>
          <button data-part="join" type="button">Join</button>
          <button data-part="release" type="button" class="secondary">Release</button>
          <details data-part="more" class="menu">
            <summary title="More">⋯</summary>
            <div class="popover">
              <button data-part="forget" type="button" class="link danger">
                Release and forget the device
              </button>
            </div>
          </details>
        </header>
        <p data-part="hint" class="hint"></p>
        <p data-part="message" class="message" hidden></p>
        <table class="tabs">
          <tbody data-part="tabs"></tbody>
        </table>
        <form data-part="send" class="send">
          <input data-part="payload" placeholder="Send to the device" spellcheck="false" />
          <select data-part="mode" title="How the input is sent">
            <option value="text">text</option>
            <option value="hex">hex</option>
          </select>
          <select data-part="terminator" title="Appended to text">
            <option value="&#13;&#10;">+ CR LF</option>
            <option value="&#10;">+ LF</option>
            <option value="&#13;">+ CR</option>
            <option value="">nothing</option>
          </select>
          <button type="submit">Send</button>
        </form>
        <div class="sections">
          <details class="section" open>
            <summary>
              Traffic <span data-part="trafficCount"></span> ·
              <button data-part="clear" type="button" class="link">clear</button>
            </summary>
            <div data-part="traffic" class="log" role="log"></div>
          </details>
          <details class="section">
            <summary>Settings <span data-part="settingsNote"></span></summary>
            <dl data-part="settings" class="settings"></dl>
          </details>
        </div>
      </article>
    </template>

    <dialog id="setupDialog">
      <form autocomplete="off">
        <h2>New configuration</h2>
        <div class="fields">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" required />
          </div>
          <div class="field wide">
            <label for="device">Device</label>
            <select id="device" name="device"></select>
          </div>
          <div class="field">
            <label for="vendorId">Vendor ID</label>
            <input id="vendorId" name="vendorId" />
          </div>
          <div class="field">
            <label for="productId">Product ID</label>
            <input id="productId" name="productId" />
          </div>
          <div class="field">
            <label for="baudRate">Baud rate</label>
            <input id="baudRate" name="baudRate" list="baudRates" />
            <datalist id="baudRates">
              <option value="9600"></option>
              <option value="19200"></option>
              <option value="38400"></option>
              <option value="57600"></option>
              <option value="115200"></option>
            </datalist>
          </div>
        </div>

        <details class="section">
          <summary>Advanced — blank means the library's default</summary>
          <div class="fields" style="margin-top: 0.5rem">
            <div class="field">
              <label for="dataBits">dataBits</label>
              <select id="dataBits" name="dataBits">
                <option value="">8</option>
                <option value="7">7</option>
                <option value="8">8</option>
              </select>
            </div>
            <div class="field">
              <label for="stopBits">stopBits</label>
              <select id="stopBits" name="stopBits">
                <option value="">1</option>
                <option value="1">1</option>
                <option value="2">2</option>
              </select>
            </div>
            <div class="field">
              <label for="parity">parity</label>
              <select id="parity" name="parity">
                <option value="">none</option>
                <option value="none">none</option>
                <option value="even">even</option>
                <option value="odd">odd</option>
              </select>
            </div>
            <div class="field">
              <label for="flowControl">flowControl</label>
              <select id="flowControl" name="flowControl">
                <option value="">none</option>
                <option value="none">none</option>
                <option value="hardware">hardware</option>
              </select>
            </div>
            <div class="field">
              <label for="bufferSize">bufferSize</label>
              <input id="bufferSize" name="bufferSize" placeholder="255" />
            </div>
            <div class="field">
              <label for="encoding">encoding</label>
              <input id="encoding" name="encoding" placeholder="utf-8" />
            </div>
            <div class="field">
              <label for="initialDelayMs">initialDelayMs</label>
              <input id="initialDelayMs" name="connection.initialDelayMs" placeholder="250" />
            </div>
            <div class="field">
              <label for="factor">factor</label>
              <input id="factor" name="connection.factor" placeholder="2" />
            </div>
            <div class="field">
              <label for="maxDelayMs">maxDelayMs</label>
              <input id="maxDelayMs" name="connection.maxDelayMs" placeholder="30000" />
            </div>
            <div class="field">
              <label for="jitter">jitter</label>
              <input id="jitter" name="connection.jitter" placeholder="0.5" />
            </div>
            <div class="field">
              <label for="maxAttempts">maxAttempts</label>
              <input id="maxAttempts" name="connection.maxAttempts" placeholder="Infinity" />
            </div>
            <div class="field">
              <label for="stableAfterMs">stableAfterMs</label>
              <input id="stableAfterMs" name="connection.stableAfterMs" placeholder="5000" />
            </div>
            <div class="field">
              <label for="openTimeoutMs">openTimeoutMs</label>
              <input id="openTimeoutMs" name="connection.openTimeoutMs" placeholder="10000" />
            </div>
            <div class="field">
              <label for="writeTimeoutMs">writeTimeoutMs</label>
              <input id="writeTimeoutMs" name="connection.writeTimeoutMs" placeholder="5000" />
            </div>
            <div class="field">
              <label for="maxWriteChunkBytes">maxWriteChunkBytes</label>
              <input
                id="maxWriteChunkBytes"
                name="connection.maxWriteChunkBytes"
                placeholder="4096"
              />
            </div>
          </div>
          <div class="row" style="margin-top: 0.5rem">
            <label class="check"><input type="checkbox" name="decodeText" /> decode text</label>
            <label class="check"
              ><input type="checkbox" name="persist" /> remember across reloads</label
            >
          </div>
        </details>

        <p data-part="error" class="message error" hidden></p>
        <div class="actions">
          <button data-action="cancel" type="button" class="secondary">Cancel</button>
          <button type="submit">Set up</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./debug.js"></script>
  </body>
</html>
