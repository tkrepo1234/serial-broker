name: Documentation site

# The documentation of the released version, on GitHub Pages: `main` holds releases only
# (ADR-0027), so every push to it is a release and publishes its documentation.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and the newest one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - run: npm ci

      # The same virtual environment `npm run docs` looks for locally (ADR-0016).
      - run: |
          python -m venv docs/.venv
          docs/.venv/bin/python -m pip install -r docs/site/requirements.txt

      - run: npm run docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
