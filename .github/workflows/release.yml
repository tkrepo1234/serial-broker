name: Release

# Every version gets a GitHub release: pushing a tag vX.Y.Z creates it, once every job of CI has
# passed on that commit, with the notes from CHANGELOG.md and the installable package attached. A
# tag with a pre-release part, such as v1.2.0-alpha.1, gets a release marked as a pre-release.
# Nothing is published to npm.
#
# Started by hand, it is a dry run for the version in package.json: the same checks, and the notes,
# the package and the browser bundle uploaded as artifacts instead of released.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fails when the tag does not match package.json or CHANGELOG.md has no section for the version,
  # before anything else runs.
  notes:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      stable: ${{ steps.notes.outputs.stable }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # A tag names the version; a dry run takes the one in package.json.
      - id: notes
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: node scripts/release-notes.mjs $TAG > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # All of CI on the commit being released: verify, the example applications, the browser suite and
  # the documentation.
  ci:
    needs: notes
    uses: ./.github/workflows/ci.yml

  release:
    needs: [notes, ci]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm pack

      # The same files a page loads without a bundler, for whoever has no npm on the machine that
      # serves them: the minified and classic builds, the worker script beside them, the type
      # declarations and the licence. The package holds them too; this is the copy you can
      # download and unzip.
      - name: Assemble the browser bundle
        env:
          VERSION: ${{ needs.notes.outputs.version }}
        run: |
          mkdir -p browser/serial-broker
          cp dist/serial-broker.min.js dist/serial-broker.min.js.map browser/serial-broker/
          cp dist/serial-broker.global.js dist/serial-broker.global.js.map browser/serial-broker/
          cp dist/serial-broker.diagnostics.min.js dist/serial-broker.diagnostics.min.js.map browser/serial-broker/
          cp dist/serial-broker.diagnostics.global.js dist/serial-broker.diagnostics.global.js.map browser/serial-broker/
          cp dist/serial-broker.worker.js dist/serial-broker.worker.js.map browser/serial-broker/
          cp dist/serial-broker.d.ts dist/serial-broker.diagnostics.d.ts LICENSE browser/serial-broker/
          cat > browser/README.txt <<'TEXT'
          serial-broker, the files a page loads without a bundler.

          Copy the serial-broker/ folder to your web server. Then, in a page that writes
          modules:

            <script type="importmap">
              { "imports": { "serial-broker/min": "/serial-broker/serial-broker.min.js" } }
            </script>
            <script type="module">
              import { SerialBroker } from 'serial-broker/min';
              SerialBroker.configure({ workerUrl: '/serial-broker/serial-broker.worker.js' });
            </script>

          Or, in a page that writes no modules at all - one global, no import map:

            <script src="/serial-broker/serial-broker.global.js"></script>
            <script>
              SerialBroker.configure({ workerUrl: '/serial-broker/serial-broker.worker.js' });
            </script>

          With the classic build the configure() call is REQUIRED and must come before the
          first setup(): a classic script cannot find the worker script by itself. Either way,
          every tab must load the worker script from the same URL. The headers a strict
          deployment needs are in the documentation, under "Deploying to a web server".
          TEXT
          cd browser && zip -qr "../serial-broker-$VERSION-browser.zip" .

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      # `--prerelease` only when the version has a pre-release part. The expression is written this
      # way round because an empty string counts as false: `stable && '' || '--prerelease'` would
      # mark every release a pre-release.
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.notes.outputs.version }}
          PRERELEASE: ${{ needs.notes.outputs.stable != 'true' && '--prerelease' || '' }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "serial-broker $VERSION"
          --notes-file release-notes.md
          $PRERELEASE
          "serial-broker-$VERSION.tgz"
          "serial-broker-$VERSION-browser.zip"

      - if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            release-notes.md
            serial-broker-${{ needs.notes.outputs.version }}.tgz
            serial-broker-${{ needs.notes.outputs.version }}-browser.zip
