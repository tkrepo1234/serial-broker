name: Release

# Every version gets a GitHub release: pushing a tag vX.Y.Z creates it, after the same checks as
# CI, with the notes from CHANGELOG.md and the installable package attached. A tag with a
# pre-release part, such as v1.2.0-alpha.1, gets a release marked as a pre-release. Nothing is
# published to npm.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Fails when the tag does not match package.json or CHANGELOG.md has no section for the
      # version, before anything is built.
      - id: notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - run: npm ci

      - run: npm run verify

      - run: npm pack

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          PRERELEASE: ${{ steps.notes.outputs.stable == 'true' && '' || '--prerelease' }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "serial-broker $VERSION"
          --notes-file release-notes.md
          $PRERELEASE
          "serial-broker-$VERSION.tgz"
