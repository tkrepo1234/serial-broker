name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of CI on the commit it releases.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Format, lint, type-check, tests with coverage gates, and build - the same command a
      # developer runs before pushing, so CI cannot disagree with the working tree.
      - run: npm run verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json

      # Every example uses the library from this repository ("file:../..") and type-checks against
      # its published types, so the library has to be built before the examples are installed.
      - run: npm ci
      - run: npm run build

      # Each example has a dependency tree of its own - a framework, its CLI, its types -
      # deliberately kept out of the root package.json (examples/README.md).
      - name: Install and type-check every example
        run: |
          set -e
          for manifest in examples/*/example.json; do
            example=$(dirname "$manifest")
            echo "::group::$example"
            (cd "$example" && npm ci && npm run typecheck)
            echo "::endgroup::"
          done

      - run: npx playwright install --with-deps chromium

      # Starts every example on its own port and runs its smoke test against the Web Serial
      # stand-in: the page loads, connects, sends a line and sees it echoed.
      - env:
          SERIAL_BROKER_BROWSER_CHANNEL: chromium
        run: npm run test:examples

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: example-traces
          path: test-results/
          retention-days: 7

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Installing Playwright downloads no browser - the package has no install script - so the
      # one this suite needs is fetched explicitly. Locally it drives the developer's installed
      # Edge instead, and fetches nothing at all (ADR-0021).
      - run: npx playwright install --with-deps chromium

      # Builds the package and runs test/browser/ against it. The hardware tests skip themselves:
      # SERIAL_BROKER_HARDWARE is not set, and no device is attached to a runner.
      - env:
          SERIAL_BROKER_BROWSER_CHANNEL: chromium
        run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
          retention-days: 7

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - run: npm ci

      # The same virtual environment `npm run docs` looks for locally (ADR-0016). The build fails
      # on any Sphinx warning, so a broken cross-reference cannot land unnoticed.
      - run: |
          python -m venv docs/.venv
          docs/.venv/bin/python -m pip install -r docs/site/requirements.txt

      - run: npm run docs

      # The built site, to download and open until it is hosted (GitHub Pages, later).
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/site/_build/html/
          retention-days: 30
