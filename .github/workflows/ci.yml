name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Format, lint, type-check, tests with coverage gates, and build - the same command a
      # developer runs before pushing, so CI cannot disagree with the working tree.
      - run: npm run verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  openui5-example:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/openui5/package-lock.json

      # The example uses the library from this repository ("file:../..") and type-checks against
      # its published types, so the library has to be built before the example is installed.
      - run: npm ci
      - run: npm run build

      # Its own dependency tree - OpenUI5 types, UI5 Tooling, the transpiler - deliberately kept
      # out of the root package.json.
      - run: npm ci
        working-directory: examples/openui5

      - run: npm run typecheck
        working-directory: examples/openui5

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - run: npm ci

      # The same virtual environment `npm run docs` looks for locally (ADR-0020). The build fails
      # on any Sphinx warning, so a broken cross-reference cannot land unnoticed.
      - run: |
          python -m venv docs/.venv
          docs/.venv/bin/python -m pip install -r docs/site/requirements.txt

      - run: npm run docs

      # The built site, to download and open until it is hosted (GitHub Pages, later).
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/site/_build/html/
          retention-days: 30
