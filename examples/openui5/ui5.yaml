specVersion: '4.0'
metadata:
  name: serial-broker.openui5
type: application

# OpenUI5 comes from npm through UI5 Tooling rather than from a CDN: every file - the framework,
# the application, the library and its worker - is then served from one origin, which is what Web
# Serial and a SharedWorker need anyway. No SAP system is involved. See README.md.
framework:
  name: OpenUI5
  version: '1.148.8'
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon

server:
  customMiddleware:
    # TypeScript sources are transpiled to UI5 modules on the fly while serving.
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: true
    # Makes `import ... from 'serial-broker'` resolvable for the UI5 module loader: the package is
    # bundled from node_modules and served as a UI5 module from this origin.
    - name: ui5-tooling-modules-middleware
      afterMiddleware: compression

builder:
  # The broker script is a worker, not a UI5 module: it must stay a file of its own, and bundling
  # it into the component preload is neither possible (it needs top-level scope) nor wanted.
  componentPreload:
    excludes:
      - 'serialbroker/openui5/serial-broker/'
      - 'serialbroker/openui5/thirdparty/'
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
    - name: ui5-tooling-modules-task
      afterTask: ui5-tooling-transpile-task
