<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>serial-broker in OpenUI5, in JavaScript</title>

    <!--
      OpenUI5 is served from this origin by UI5 Tooling (see ui5.yaml), not from a CDN: Web Serial
      needs a secure context, and the shared worker has to come from the page's own origin anyway.

      Nothing between these sources and the browser: the files under webapp/ are the files that
      load. The TypeScript sibling (examples/openui5) transpiles its sources while serving.

      The component id is set explicitly, so the DOM ids of the controls are stable and a test can
      find them: <containerId>-<componentId>---<rootViewId>--<controlId>, e.g.
      container-serialbroker---app--connectButton.
    -->
    <script
      id="sap-ui-bootstrap"
      src="resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-async="true"
      data-sap-ui-compat-version="edge"
      data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
      data-sap-ui-resource-roots='{"serialbroker.openui5js": "./"}'
    ></script>
  </head>

  <body class="sapUiBody" id="content">
    <div
      data-sap-ui-component
      data-name="serialbroker.openui5js"
      data-id="container"
      data-settings='{"id": "serialbroker"}'
      data-height="100%"
    ></div>
  </body>
</html>
