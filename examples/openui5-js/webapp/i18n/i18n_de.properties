status.idle=Bereit - noch kein Verbindungsversuch
status.queued=Wartet auf einen Platz (ein anderer Tab hält die Konfiguration)
status.awaiting-permission=Wartet auf die Freigabe - Port über "Verbinden" wählen
status.connecting=Verbindet...
status.open=Offen - der Port ist verbunden
status.reconnecting=Verbindet erneut...
status.failed=Fehlgeschlagen - siehe Meldung oben
status.released=In diesem Tab freigegeben
status.unsupported=Dieser Browser kann nicht mit seriellen Geräten sprechen
status.unknown=Unbekannter Status: {0}

deviceAny=Gerät: jeder freigegebene Port, {0} Baud
