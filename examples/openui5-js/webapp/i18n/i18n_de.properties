openSecondTab=Zweiten Tab öffnen

unsupportedText=Dieser Browser hat kein Web Serial, keine Web Locks oder keinen Nachrichtenkanal. Web Serial braucht einen Chromium-Browser (Chrome, Edge) und einen sicheren Kontext - HTTPS oder localhost.
