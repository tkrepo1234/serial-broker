# Texte des serial-broker-Beispiels für SAPUI5 in JavaScript (Deutsch).
#
# Diese Datei ist UTF-8. UI5 Tooling liest .properties-Dateien seit Spezifikationsversion 2.0
# standardmäßig als UTF-8 und ersetzt beim Ausliefern und Bauen alle Nicht-ASCII-Zeichen durch
# \uXXXX-Sequenzen, so dass der UI5-Loader sie korrekt erhält - siehe README.md.

appTitle=serial-broker in OpenUI5, in JavaScript
appDescription=Ein serieller Port, alle Tabs - eingebunden in eine klassische SAPUI5-Anwendung

connectionPanel=Verbindung
