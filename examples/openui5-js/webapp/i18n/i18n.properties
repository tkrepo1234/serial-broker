# Texts of the serial-broker SAPUI5 example in JavaScript. The default bundle is English.

appTitle=serial-broker in OpenUI5, in JavaScript
appDescription=One serial port, every tab - bound into a classic SAPUI5 application

connectionPanel=Connection
statusLabel=Status
connect=Connect
release=Release
reconnect=Set up again
gestureHint=The browser shows its port picker only in response to a click, so "Connect" asks for the device. Once a port has been granted, later visits open it without asking.

status.idle=Idle - not connecting yet
status.queued=Waiting for a place (another tab holds the configuration)
status.awaiting-permission=Waiting for permission - choose the port with "Connect"
status.connecting=Connecting...
status.open=Open - the port is connected
status.reconnecting=Reconnecting...
status.failed=Failed - see the message above
status.released=Released in this tab
status.unsupported=This browser cannot talk to serial devices
status.unknown=Unknown status: {0}

deviceAny=Device: any port the user grants, {0} baud
deviceUsb=Device: {0} / {1}, {2} baud
deviceUnknown=Device: not registered yet

trafficPanel=Traffic
send=Send
sendPlaceholder=Command, e.g. STATUS?
appendNewline=Append CR LF
clear=Clear
counters={0} bytes received, {1} bytes sent
noTraffic=Nothing received yet. Lines appear here as soon as the device sends.

printerPanel=Second configuration
printerHint=A second device, set up with its own name, its own USB ids and its own model - to show that one application can hold several configurations at once.

sharingPanel=Sharing across tabs
sharingText=Open this page a second time: both tabs show the same status, both receive what the device sends, and both can send. One tab holds the port; when you close it, another one takes over.
openSecondTab=Open a second tab

unsupportedText=This browser has no Web Serial, no Web Locks, or no message bus. Web Serial needs a Chromium-based browser (Chrome, Edge) and a secure context - HTTPS or localhost.
errorText={0}: {1} - {2}
connectDismissed=No port was chosen.
released=Configuration {0} released in this tab.
