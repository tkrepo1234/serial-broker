<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>serial-broker: minimal</title>
    <!-- No icon, said explicitly, so the browser does not ask for one and log a 404. -->
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0 auto;
        max-width: 48rem;
        padding: 1.5rem 1rem;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: #1f2933;
        background: #fff;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 1rem;
      }
      h1 small {
        font-weight: normal;
        color: #5e6b78;
      }
      #status {
        display: inline-block;
        padding: 0.1rem 0.6rem;
        border-radius: 1rem;
        font-family: ui-monospace, monospace;
        background: #dfe4ea;
      }
      #status[data-status='open'] {
        background: #c6f0d2;
      }
      #status[data-status='connecting'],
      #status[data-status='reconnecting'],
      #status[data-status='queued'] {
        background: #ffe8b3;
      }
      #status[data-status='failed'] {
        background: #f8c9c9;
      }
      #error {
        margin: 0.75rem 0;
        padding: 0.6rem 0.8rem;
        border-left: 4px solid #c62828;
        background: #fdecea;
      }
      #error[data-retryable='true'] {
        border-left-color: #b98a00;
        background: #fff6db;
      }
      #error-code {
        font-family: ui-monospace, monospace;
      }
      #received {
        min-height: 12rem;
        max-height: 24rem;
        overflow: auto;
        margin: 0.75rem 0;
        padding: 0.6rem 0.8rem;
        border: 1px solid #cfd6de;
        background: #f6f8fa;
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      form {
        display: flex;
        gap: 0.5rem;
      }
      input {
        flex: 1;
        font: inherit;
        padding: 0.35rem 0.5rem;
      }
      button {
        font: inherit;
        padding: 0.35rem 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>serial-broker <small>the smallest page that works</small></h1>

    <p>
      Status: <span id="status" data-status="idle">idle</span>
      <span id="status-hint"></span>
      <!-- Shown only while the browser needs a click: its port picker opens on a user gesture. -->
      <button id="connect" hidden>Connect…</button>
    </p>

    <div id="error" hidden>
      <strong id="error-code"></strong> <span id="error-message"></span>
      <em id="error-remediation"></em>
    </div>

    <pre id="received" aria-label="Received"></pre>

    <form id="send-form">
      <input id="send-input" placeholder="Line to send" autocomplete="off" />
      <button id="send-button" disabled>Send</button>
    </form>

    <p>
      Open this page in a second tab: both show the same status, both receive, both can send. One of
      them holds the port; close it, and the other takes over.
    </p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
